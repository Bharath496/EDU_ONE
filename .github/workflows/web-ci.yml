name: Project CI

on:
  push:
    branches: [main, know-envi-rebuild]
  pull_request:
    branches: [main, know-envi-rebuild]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm --prefix apps/web install --no-audit --no-fund

      - name: Lint
        run: npm run lint:web

      - name: Typecheck
        run: npm run typecheck:web

      - name: Build
        run: npm run build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Test API
        run: python -m pytest apps/api -q

      - name: Validate database migration
        run: alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./ci.db

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-url-safe-password
          JWT_SECRET_KEY: ci-only-secret-with-at-least-32-bytes
        run: docker compose config --quiet

      - name: Build API container
        run: docker build --tag eduone-api:ci apps/api

      - name: Start PostgreSQL and API integration stack
        env:
          POSTGRES_PASSWORD: ci-url-safe-password
          JWT_SECRET_KEY: ci-only-secret-with-at-least-32-bytes
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop integration stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-url-safe-password
          JWT_SECRET_KEY: ci-only-secret-with-at-least-32-bytes
        run: docker compose down --volumes
